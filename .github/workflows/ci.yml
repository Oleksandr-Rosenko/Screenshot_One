name: CI

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ffmpeg.exe не зберігається в git (важкий бінарник), а тест VideoTrimming_BundledFFmpeg його очікує
      - name: Download ffmpeg
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "ffmpeg")
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP "ffmpeg") -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName "ScreenShot_One_Avalonia/ffmpeg.exe"

      - name: Build
        run: dotnet build ScreenShot_One_Avalonia.slnx -c Release -p:Platform=x64

      - name: Test
        # --blame-hang: завислий тест зупиняється через 3 хв і називається в журналі
        run: dotnet test ScreenShot_One_Avalonia.Tests -c Release -p:Platform=x64 --no-build --logger "console;verbosity=normal" --blame-hang-timeout 3m --blame-hang-dump-type none

      # Справжній запуск програми з самоперевіркою панелі трею: програма сама «клікає» значок,
      # і в журналі має бути «панель трею відкрита через 2,5 с: True»
      - name: Launch app and self-test tray panel
        shell: pwsh
        run: |
          $exe = Get-ChildItem ScreenShot_One_Avalonia/bin -Recurse -Filter Screenshot_One.exe | Where-Object { $_.FullName -match 'Release\\net10\.0-windows' } | Select-Object -First 1  # саме Windows-збірка (у net10.0 знімок — заглушка)
          Write-Host "Exe: $($exe.FullName)"
          Start-Process notepad   # вікно іншої програми для самоперевірки «знімок вікна»
          $env:SO_SELFTEST_TRAY = "1"
          $env:SO_SELFTEST_KEYS = "1"
          $env:SO_SELFTEST_CAPTURE = "1"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          $log = Join-Path $env:LOCALAPPDATA "Screenshot_One/logs/app.log"
          Write-Host "----- app.log -----"
          if (Test-Path $log) { Get-Content $log -Tail 60 }
          if (-not $alive) { throw "App exited early (code $($p.ExitCode))" }
          if (-not (Select-String -Path $log -Pattern 'SelfTest\].*2,5.*True' -Quiet)) { throw "Tray panel self-test (left click) failed" }
          if (-not (Select-String -Path $log -Pattern 'SelfTest\].*→.*True' -Quiet)) { throw "Tray panel self-test (right click) failed" }
          if (-not (Select-String -Path $log -Pattern 'SelfTest\] клавіші.*True' -Quiet)) { throw "Keystroke overlay self-test failed" }
          if (-not (Select-String -Path $log -Pattern 'SelfTest\] вікна.*True' -Quiet)) { throw "Window list self-test failed" }
          if (-not (Select-String -Path $log -Pattern 'SelfTest\] оверлей.*True' -Quiet)) { throw "Selection overlay self-test failed" }
          if (Select-String -Path $log -Pattern '\[Capture\].*картинка немає' -Quiet) { throw "Screen capture returned no image" }

  macos:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build ScreenShot_One_Avalonia/ScreenShot_One_Avalonia.csproj -f net10.0 -c Release -p:EnableWindowsTargeting=true

      # OCR-утиліта для Mac: компілюємо під обидві архітектури, щоб помилки в Swift ловились до релізу
      - name: Build ocr-helper (Swift)
        run: |
          swiftc -O -target arm64-apple-macos11 -o "$RUNNER_TEMP/ocr-helper-arm64" ScreenShot_One_Avalonia/MacHelpers/ocr.swift
          swiftc -O -target x86_64-apple-macos11 -o "$RUNNER_TEMP/ocr-helper-x64" ScreenShot_One_Avalonia/MacHelpers/ocr.swift

      # Справжня перевірка Vision: утиліта малює «Screenshot One 2026» і має його розпізнати
      - name: OCR self-test
        run: |
          out=$("$RUNNER_TEMP/ocr-helper-$(uname -m | sed 's/x86_64/x64/')" --selftest)
          echo "Recognized: $out"
          echo "$out" | grep -qi "screenshot"

      # Утиліта знімка екрана (ScreenCaptureKit, macOS 14+) — теж під обидві архітектури
      - name: Build capture-helper (Swift)
        run: |
          swiftc -O -target arm64-apple-macos14 -o "$RUNNER_TEMP/capture-helper-arm64" ScreenShot_One_Avalonia/MacHelpers/capture.swift
          swiftc -O -target x86_64-apple-macos14 -o "$RUNNER_TEMP/capture-helper-x64" ScreenShot_One_Avalonia/MacHelpers/capture.swift
          file "$RUNNER_TEMP/capture-helper-arm64" | grep -q arm64
          file "$RUNNER_TEMP/capture-helper-x64" | grep -q x86_64

      # Справжній знімок головного дисплея. У раннера GitHub може не бути дозволу «Запис екрана» —
      # тоді утиліта повертає код 4, і це пропуск, а не помилка. Неправильні аргументи — код 1.
      - name: Capture self-test
        run: |
          helper="$RUNNER_TEMP/capture-helper-$(uname -m | sed 's/x86_64/x64/')"
          set +e
          "$helper" --bogus > /dev/null 2>&1; code=$?
          set -e
          test "$code" = "1" || { echo "expected exit code 1 for bad arguments, got $code"; exit 1; }
          set +e
          out=$("$helper" --selftest --timeout 60 --out "$RUNNER_TEMP/capture-selftest.png" 2>&1); code=$?
          set -e
          echo "$out"
          if [ "$code" = "4" ]; then
            echo "::notice title=capture-helper::No Screen Recording permission on this runner, self-test skipped"
          elif [ "$code" = "0" ]; then
            echo "$out" | grep -q '^OK:'
            file "$RUNNER_TEMP/capture-selftest.png" | grep -q 'PNG image data'
            "$helper" --list
          else
            echo "capture-helper self-test failed with exit code $code"; exit 1
          fi

      # Повна збірка для Mac, як у релізі: .app для обох архітектур, ffmpeg усередині, підпис, інсталятор .pkg
      - name: Build macOS bundles and installer
        shell: pwsh
        working-directory: ScreenShot_One_Avalonia
        env:
          EnableWindowsTargeting: 'true'
        run: ./Build-MacApp.ps1 -Arch all -Version 0.0.0

      - name: Verify macOS bundle
        working-directory: ScreenShot_One_Avalonia/dist/macOS
        run: |
          set -e
          ls -la
          test -f Screenshot_One-v0.0.0-macOS.pkg
          test -f Screenshot_One-v0.0.0-macOS-arm64.zip
          test -f Screenshot_One-v0.0.0-macOS-x64.zip
          for a in arm64 x64; do codesign --verify --strict --verbose=2 "$a/Screenshot_One.app"; done
          file arm64/Screenshot_One.app/Contents/MacOS/ffmpeg | grep -q arm64
          file x64/Screenshot_One.app/Contents/MacOS/ffmpeg | grep -q x86_64
          file arm64/Screenshot_One.app/Contents/MacOS/capture-helper | grep -q arm64
          file x64/Screenshot_One.app/Contents/MacOS/capture-helper | grep -q x86_64
          file arm64/Screenshot_One.app/Contents/MacOS/ocr-helper | grep -q arm64
          arm64/Screenshot_One.app/Contents/MacOS/ffmpeg -hide_banner -version | head -1
          pkgutil --expand Screenshot_One-v0.0.0-macOS.pkg "$RUNNER_TEMP/pkg-expanded"
          ls "$RUNNER_TEMP/pkg-expanded"
          grep -q hostArchitectures "$RUNNER_TEMP/pkg-expanded/Distribution"

      # Справжній запуск: ставимо .pkg як користувач і перевіряємо, що програма живе 25 секунд
      - name: Install .pkg and smoke-test launch
        working-directory: ScreenShot_One_Avalonia/dist/macOS
        run: |
          set +e
          sudo installer -pkg Screenshot_One-v0.0.0-macOS.pkg -target / -verboseR
          ls -la /Applications/Screenshot_One.app/Contents/MacOS | head -5
          codesign --verify --strict --verbose=2 /Applications/Screenshot_One.app
          # Довідково: утиліта знімка з установленого бандла (код 4 — немає дозволу «Запис екрана»)
          /Applications/Screenshot_One.app/Contents/MacOS/capture-helper --list --timeout 30; echo "capture-helper --list exit code: $?"
          pkill -x Screenshot_One; sleep 2
          SO_SELFTEST_TRAY=1 SO_SELFTEST_CAPTURE=1 /Applications/Screenshot_One.app/Contents/MacOS/Screenshot_One > "$RUNNER_TEMP/app.out" 2>&1 &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then echo "APP ALIVE after 25s"; ALIVE=1; kill $PID; else echo "APP DIED"; ALIVE=0; fi
          echo "----- stdout/stderr -----"; tail -n 80 "$RUNNER_TEMP/app.out"
          echo "----- app.log -----"; tail -n 80 "$HOME/Library/Application Support/Screenshot_One/logs/app.log" 2>/dev/null
          echo "----- last_crash.txt -----"; cat "$HOME/Library/Application Support/Screenshot_One/logs/last_crash.txt" 2>/dev/null
          echo "----- crash reports -----"
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*Screenshot* ~/Library/Logs/DiagnosticReports/*Avalonia* 2>/dev/null | head -2); do echo "== $f"; head -c 12000 "$f"; done
          test "$ALIVE" = "1" || exit 1
          # Панель трею: власний значок у рядку меню створено, програмний клік відкрив панель
          LOG="$HOME/Library/Application Support/Screenshot_One/logs/app.log"
          grep -a "MacStatusItem" "$LOG"
          grep -a "TrayPanel" "$LOG"
          grep -aq "SelfTest.*True" "$LOG" || exit 1
          # Оверлей виділення: на весь екран над рядком меню, без «рідного» повноекранного режиму
          grep -a "\[Capture\]" "$LOG" || true
          grep -a "SelfTest\] оверлей" "$LOG"
          grep -aq "SelfTest\] оверлей.*True" "$LOG" || exit 1
